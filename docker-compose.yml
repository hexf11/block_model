# 本地开发用 ClickHouse。
#
# 端口只绑定在 127.0.0.1，不暴露到局域网：default 用户没有密码，
# 一旦监听 0.0.0.0 同网段任何人都能读写这个库。
#
#   docker compose up -d
#   docker compose exec clickhouse clickhouse-client < migrations/001_twap.sql

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: pm-clickhouse
    ports:
      - "127.0.0.1:8123:8123"   # HTTP —— clickhouse crate 走这个协议
      - "127.0.0.1:9000:9000"   # native —— clickhouse-client 用
    volumes:
      - ch-data:/var/lib/clickhouse
      # 官方镜像把 default 用户限制在容器内的 127.0.0.1；经端口映射进来的
      # 连接源 IP 是 Docker 网关，不在白名单里，会认证失败。这个覆盖文件
      # 去掉该限制 —— 安全边界由上面的 127.0.0.1 端口绑定来保证。
      - ./docker/default-user.xml:/etc/clickhouse-server/users.d/default-user.xml:ro
    ulimits:
      # ClickHouse 默认要求很高的 fd 上限，不放开会在启动时刷警告
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ch-data:
